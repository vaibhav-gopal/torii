[workspace]
members = ["src/logger/logger_proc"]

[package]
name = "torii_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling with thiserror and anyhow for prototyping
thiserror = "2.0.12"
anyhow = "1.0.98"
# For tracing / logging
tracing = "0.1.41"
tracing-subscriber = {version = "0.3.19", features = ["fmt", "json", "env-filter"]}
tracing-timing = { version = "0.6", optional = true }
# Serialization (bincode and json) (maybe look into rkyv or speedy replacing bincode)
serde = "1.0.219"
bincode = "2.0.1"
serde_json = "1.0.140"
# Windowing and gpu
winit = "0.30.11"
wgpu = "25.0.2"
# Math / Linalg (look into nalgebra, ndarray, or others with BLAS)
glam = "0.30.3"
# Sync (parking lot for sync primitives : std might be fast enough here, and flume for MPMC channels)
# parking_lot = "0.12.4"
flume = "0.11.1"
# Async (tokio for asset IO, or roll your own for fun ; good luck tho lmao)
# tokio = "1.45.1"

[features]
tracing-json-logs = []
tracing-timing = ["dep:tracing-timing"]
